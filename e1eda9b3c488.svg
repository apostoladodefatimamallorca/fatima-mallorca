<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <radialGradient id="dawn" cx="50%" cy="70%" r="70%">
      <stop offset="0%" stop-color="#f9d77e"/>
      <stop offset="40%" stop-color="#e8956d"/>
      <stop offset="100%" stop-color="#1a0508"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff9e6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f9d77e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="400" fill="url(#dawn)"/>
  <!-- Ground -->
  <ellipse cx="400" cy="380" rx="500" ry="60" fill="#2a0a0a" opacity="0.6"/>
  <!-- Glow behind cross -->
  <ellipse cx="400" cy="200" rx="180" ry="180" fill="url(#glow)"/>
  <!-- Cross -->
  <rect x="388" y="80" width="24" height="200" rx="4" fill="#1a0508" opacity="0.9"/>
  <rect x="330" y="130" width="140" height="24" rx="4" fill="#1a0508" opacity="0.9"/>
  <!-- Stars -->
  <circle cx="100" cy="60" r="2" fill="white" opacity="0.7"/>
  <circle cx="200" cy="30" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="650" cy="50" r="2" fill="white" opacity="0.6"/>
  <circle cx="720" cy="90" r="1.5" fill="white" opacity="0.4"/>
  <!-- Rolling stone -->
  <ellipse cx="520" cy="340" rx="55" ry="50" fill="#3a1a0a" opacity="0.8"/>
  <ellipse cx="510" cy="330" rx="40" ry="36" fill="#5a2a1a" opacity="0.6"/>
  <!-- Tomb entrance -->
  <ellipse cx="320" cy="350" rx="70" ry="50" fill="#0a0205" opacity="0.9"/>
  <!-- Light from tomb -->
  <ellipse cx="320" cy="340" rx="45" ry="32" fill="#f9d77e" opacity="0.3"/>
</svg>